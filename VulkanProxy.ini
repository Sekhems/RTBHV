[spirv]
; --- Базовые запреты (FAKE-им то, чего нет на GCN2) ---
DenyFloat16=0
DenyInt16=0
DenyDotProduct=1
DenyRayTracing=1
DenyMesh=1

; --- Понижение 16-битной арифметики до 32-бит (КРИТИЧНО для idTech) ---
; Включено по умолчанию — переписывает fp16/int16 ALU -> fp32/int32,
; память остаётся 16-битной. Без этого меню/интерфейс будут чёрными.
LowerFp16AndInt16=1
LowerFp16=1
PromoteFloat16=0
DropF16Cap=0

; --- Ray Query: переписываем, а не FAKE-им ---
; Позволяет шейдерам освещения работать (просто "ничего не попало").
RewriteRayQuery=1

; --- SPIR-V версия: 1.6 -> 1.5 (AMDVLK для GCN2 знает только 1.5) ---
PatchVersion=1

; --- Защита от зависаний (КРИТИЧНО для Doom TDA) ---
; Compute-шейдеры denoiser'а в Doom весят 80k-100k слов SPIR-V и вешают
; LLPC на GCN2 на 40+ минут. FAKE-им их сразу.
; [v4-HANG] Исправлено: реальное зависание вызывал графический pipeline
; (переписанные ray-query шейдеры освещения 128k-160k слов), а не compute.
; Теперь он изолируется gate HeavyGraphicsWords ниже, а compute-вызовы
; защищены таймаутом ComputeTimeoutSec + watchdog. Порог поднят, чтобы
; драйвер обрабатывал compute-шейдеры >80000 слов; те, что всё ещё вешаются,
; ABANDONED после ComputeTimeoutSec и не блокируют игру.
; [v4-HANG-FIX] Логи зависания показывают 4 compute-пайплайна, которые
; LLPC на GCN2 не компилирует никогда (30-184 с, ABANDONED): комбинация
; Float16 + Int64 + Int16 + SampledBuffer + StorageImageExtendedFormats +
; GroupNonUniform + GroupNonUniformVote + GroupNonUniformBallot +
; SubgroupBallotKHR + StorageBuffer16BitAccess + UniformAndStorageBuffer16BitAccess.
; Запрет по точной комбинации: SHADER FAKEется без вызова драйвера,
; остальные compute-шейдеры (включая >80000 слов) идут в драйвер как обычно.
DenyComputeAllCaps=9,11,22,46,49,61,62,64,4423,4433,4434
HeavyComputeWords=200000
; [v4-HANG] Графические шейдеры >= этого количества слов НЕ отправляются в драйвер
; (становятся FAKE). Убирает 3.4с-й вызов vkCreateGraphicsPipelines, который
; возвращал -4 и зависал процесс. 0 = off.
HeavyGraphicsWords=90000
ComputeTimeoutSec=12
HeavyShaderWords=0
CompileTimeoutSec=45
MaxAbandoned=4
PinStuckThreads=1
; [v4-HANG] Таймаут для vkQueueSubmit / vkQueueWaitIdle / vkWaitForFences.
; Если драйвер не возвращает вовремя — вызов ABANDONED на worker-потоке,
; игра продолжает работать. 0 = off.
SubmitTimeoutSec=30

; --- Параллелизм компиляции ---
; На 4-ядерном CPU ставим 2 параллельных вызова драйвера.
; SerializeCompile=-1 (авто) или 0 (без лимита). 1 = строго по одному (медленно).
SerializeCompile=-1
CompileThreads=2

; --- Pipeline cache (ОБЯЗАТЕЛЬНО) ---
; Без него каждый запуск = компиляция тысяч шейдеров по 5-60 сек.
; Кэш сохраняется в VulkanProxy_pipeline.cache рядом с dll.
PipelineCache=1

; --- Watchdog и диагностика ---
Watchdog=1
StallDumpSec=20
CatchDriverCrash=1

; --- Запасные варианты ---
; Если драйвер отвергает шейдер — пробуем альтернативные переписывания.
TryVariants=1
KeepShaderCode=1

; --- Пост-обработка ---
; Без RT сцена темнее. Чуть поднимаем яркость.
BrightnessGain=1.25

; --- Логирование ---
Verbose=0
LogAll=0
DumpRewrite=0
DumpRewriteFail=3
DumpSamples=0
UseReplacements=1

[rt]
; --- Заполнение RT-выходов (КРИТИЧНО) ---
; Без этого на месте RT-эффектов будут чёрные квадраты / мусор.
Fill=1
; 0 = серый ambient, 1 = чёрный, 2 = голубоватый (небо-подобный)
FillMode=2
Ambient=35
; Чистить каждый кадр (иначе на статичных сценах RT-выходы "застревают")
EveryFrame=1
Log=1

; =====================================================================
; [v4-SRT] Software Ray Tracing — реальная трассировка лучей в ПО.
; Doom TDA строит освещение/GI через hardware ray tracing (VK_KHR_ray_query).
; На GCN2 нет RT-ядер, поэтому прокси вычисляет пересечения в software:
;  захватывает геометрию из vkCmdBuildAccelerationStructuresKHR, строит BVH,
;  переписывает OpRayQuery*/OpTraceRayKHR в программный обход BVH и подает
;  настоящие данные пересечения вместо константного заполнения (rtfill).
; SoftRT=0 — откат к старому константному заполнению (скрин #1).
SoftRT=1
; Захват геометрии AS и построение software BVH
SoftRTBuildBVH=1
; Максимум узлов BVH (защита от неограниченной геометрии)
SoftRTMaxNodes=1048576
; Переписывать OpRayQuery*/OpTraceRayKHR в обход BVH
SoftRTTrace=1
; Если шейдер не переписать — заполнять его RT-выход ambient
SoftRTFallbackFill=1
; Уровень ambient для miss/непросчитанных пикселей
SoftRTAmbient=0.35
; Логирование BVH-построек и trace-диспатчей
SoftRTLog=1