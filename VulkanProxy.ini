[spirv]
; --- Базовые запреты (FAKE-им то, чего нет на GCN2) ---
DenyFloat16=0
DenyInt16=0
DenyDotProduct=1
DenyRayTracing=1
DenyMesh=1

; --- Понижение 16-битной арифметики до 32-бит (КРИТИЧНО для idTech) ---
; Включено по умолчанию — переписывает fp16/int16 ALU -> fp32/int32,
; память остаётся 16-битной. Без этого меню/интерфейс будут чёрными.
LowerFp16AndInt16=1
LowerFp16=1
PromoteFloat16=0
DropF16Cap=0

; --- Ray Query: переписываем, а не FAKE-им ---
; Позволяет шейдерам освещения работать (просто "ничего не попало").
RewriteRayQuery=1

; --- SPIR-V версия: 1.6 -> 1.5 (AMDVLK для GCN2 знает только 1.5) ---
PatchVersion=1

; --- Защита от зависаний (КРИТИЧНО для Doom TDA) ---
; Compute-шейдеры denoiser'а в Doom весят 80k-100k слов SPIR-V и вешают
; LLPC на GCN2 на 40+ минут. FAKE-им их сразу.
;Макс значение для R7 260X выше уже виснет
HeavyComputeWords=67259   
ComputeTimeoutSec=12
HeavyShaderWords=0
CompileTimeoutSec=45
MaxAbandoned=4
PinStuckThreads=1

; --- Параллелизм компиляции ---
; На 4-ядерном CPU ставим 2 параллельных вызова драйвера.
; SerializeCompile=-1 (авто) или 0 (без лимита). 1 = строго по одному (медленно).
SerializeCompile=-1
CompileThreads=2

; --- Pipeline cache (ОБЯЗАТЕЛЬНО) ---
; Без него каждый запуск = компиляция тысяч шейдеров по 5-60 сек.
; Кэш сохраняется в VulkanProxy_pipeline.cache рядом с dll.
PipelineCache=1

; --- Watchdog и диагностика ---
Watchdog=1
StallDumpSec=20
CatchDriverCrash=1

; --- Запасные варианты ---
; Если драйвер отвергает шейдер — пробуем альтернативные переписывания.
TryVariants=1
KeepShaderCode=1

; --- Пост-обработка ---
; Без RT сцена темнее. Чуть поднимаем яркость.
BrightnessGain=1.25

; --- Логирование ---
Verbose=0
LogAll=0
DumpRewrite=0
DumpRewriteFail=3
DumpSamples=0
UseReplacements=1

[rt]
; --- Заполнение RT-выходов (КРИТИЧНО) ---
; Без этого на месте RT-эффектов будут чёрные квадраты / мусор.
Fill=1
; 0 = серый ambient, 1 = чёрный, 2 = голубоватый (небо-подобный)
FillMode=2
Ambient=35
; Чистить каждый кадр (иначе на статичных сценах RT-выходы "застревают")
EveryFrame=1
Log=1